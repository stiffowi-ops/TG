name: Check public Yandex photo folder
on:
  workflow_dispatch:
  push:
    paths:
      - 'internal/photosync/**'
      - '.github/workflows/photo-source-check.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public Yandex API without credentials
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.parse,collections
          share='https://disk.yandex.ru/d/TpiMfBy9WROTGg'
          url='https://cloud-api.yandex.net/v1/disk/public/resources?'+urllib.parse.urlencode({'public_key':share,'limit':100,'offset':0})
          print('Checking Yandex public folder, using the same API endpoint as the bot.')
          try:
            req=urllib.request.Request(url,headers={'User-Agent':'Karty-MiniApp-photo-diagnostic/1.0'})
            with urllib.request.urlopen(req,timeout=20) as response:
              data=json.load(response)
              items=data.get('_embedded',{}).get('items',[])
              print('HTTP status:',response.status,'type:',data.get('type'))
              print('Root entries (first page):',len(items),'total:',data.get('_embedded',{}).get('total'))
              print('Types:',dict(collections.Counter(item.get('type') for item in items)))
              for item in items[:25]:
                print('entry:',item.get('name'), 'type:',item.get('type'), 'size:',item.get('size'), 'path:',item.get('path'))
              # Verify that the real file can be resolved through the download endpoint.
              if items:
                first=items[0]['name']
                link='https://cloud-api.yandex.net/v1/disk/public/resources/download?'+urllib.parse.urlencode({'public_key':share,'path':'/'+first})
                with urllib.request.urlopen(urllib.request.Request(link,headers={'User-Agent':'Karty-photo-diagnostic/1.0'}),timeout=20) as response:
                  from urllib.parse import urlsplit
                  result=json.load(response)
                  target=result.get('href','')
                  print('Download link host:',urlsplit(target).hostname,'scheme:',urlsplit(target).scheme)
                  print('Download link available:',bool(target))
          except Exception as e:
            print('Source check failed:',type(e).__name__,str(e))
          PY
