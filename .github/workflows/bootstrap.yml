name: Install Mini App source
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    if: github.event.head_commit.message == 'Stage Mini App source for extraction'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Unpack checked source and replace old files
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part* | base64 --decode > /tmp/miniapp.tar.xz
          echo "36de2463b44a114b18b4398b36c45ef18433cdc034a468c57d7b40470af8648d  /tmp/miniapp.tar.xz" | sha256sum -c -
          git rm -r .
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          tar -xJf /tmp/miniapp.tar.xz -C .
          test -f web/src/App.tsx
          test -f web/src/styles.css
          test -f cmd/server/main.go
          test -f cmd/testbot/main.go
          rm -f .github/workflows/checks.yml
          git show HEAD:.github/workflows/bootstrap.yml > .github/workflows/bootstrap.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Replace legacy bot with Telegram Mini App prototype"
          git push origin HEAD:main
