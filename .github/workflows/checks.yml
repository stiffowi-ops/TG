name: Demo checks
on:
  push:
  pull_request:
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
  bothost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate startup script
        run: bash -n scripts/start-bothost.sh
      - name: Build Bothost Docker image
        run: docker build -t miniapp-bothost-check .
      - name: Smoke test with /app bind mount and Bothost PORT
        run: |
          docker run -d --name miniapp-smoke -e PORT=18080 -e DATA_DIR=/tmp/miniapp-smoke -p 18080:18080 -v "$PWD:/app:ro" miniapp-bothost-check
          trap 'docker logs miniapp-smoke || true; docker rm -f miniapp-smoke >/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/api/health | grep -q '"ok":true'; then
              curl -fsS http://127.0.0.1:18080/ | grep -q '<html'
              exit 0
            fi
            sleep 1
          done
          exit 1

  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build real Mini App server and frontend
        run: |
          cd web
          npm install --no-audit --no-fund
          npm run build
          cd ..
          go build -o /tmp/miniapp-real-ui ./cmd/server
      - name: Start application locally
        run: |
          mkdir -p /tmp/miniapp-ui-data
          DATA_DIR=/tmp/miniapp-ui-data WEB_DIST="$GITHUB_WORKSPACE/web/dist" ADDR=:8080 /tmp/miniapp-real-ui >/tmp/miniapp-ui-server.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/locations >/tmp/catalog-response.json
      - name: Install Chromium for genuine browser captures
        run: |
          mkdir -p /tmp/miniapp-playwright
          npm install --prefix /tmp/miniapp-playwright --no-audit --no-fund playwright@1.57.0
          /tmp/miniapp-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Capture actual running UI on mobile viewport
        run: NODE_PATH=/tmp/miniapp-playwright/node_modules node scripts/capture-screenshots.cjs
      - name: Upload original screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miniapp-real-screenshots
          path: screenshots/
          if-no-files-found: warn
          retention-days: 7
